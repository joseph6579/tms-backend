server {
    listen 80;
    server_name api.chuom.gikure.com flower.chuom.gikure.com routing.chuom.gikure.com vroom.chuom.gikure.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.chuom.gikure.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/api.chuom.gikure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chuom.gikure.com/privkey.pem;

    # SSL settings (recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;  # Optional for additional security

    # Proxy requests to Django backend
    location / {
        proxy_pass http://tms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files
    location /static/ {
        autoindex off;
        alias /code/static/;
        add_header Cache-Control "public, max-age=3600";
    }

    # Serve media files
    location /media/ {
        autoindex off;
        alias /code/media/;
    }

    # Logs (optional)
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;
}

server {
    listen 443 ssl;
    server_name flower.chuom.gikure.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/flower.chuom.gikure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flower.chuom.gikure.com/privkey.pem;

    # SSL settings (recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/ssl/certs/dhparam.pem;

    # Proxy requests to Celery Flower
    location /flower/ {
        proxy_pass http://tms_celery_flower/flower/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files for Flower
    location /flower/static/ {
        proxy_pass http://tms_celery_flower/flower/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve media files for Flower
    location /flower/media/ {
        proxy_pass http://tms_celery_flower/flower/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs (optional)
    access_log /var/log/nginx/flower_access.log;
    error_log /var/log/nginx/flower_error.log;
}

# Similar server block for routing.choum.gikure.com and vroom.chuom.gikure.com
